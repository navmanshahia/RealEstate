name: Validate Estate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  php-and-integration:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: Root-test-pass-123
          MYSQL_DATABASE: estate_wizard
          MYSQL_USER: estate
          MYSQL_PASSWORD: Wizard-database-pass-123
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_sqlite, pdo_mysql, mbstring, fileinfo, curl
          coverage: none
      - name: cPanel deployment preservation
        run: python3 tests/deployment.py
      - name: PHP syntax
        run: find . -name '*.php' -not -path './storage/*' -print0 | xargs -0 -n1 php -l
      - name: JavaScript syntax
        run: node --check assets/app.js
      - name: Backend integration and isolation
        run: python3 tests/integration.py
      - name: Automatic MySQL installation wizard
        env:
          MYSQL_TEST: '1'
        run: python3 tests/install_wizard.py
      - name: Package cPanel release
        run: zip -r estate-cpanel.zip index.php api.php install.php app assets storage .htaccess README.md -x app/config.php
      - uses: actions/upload-artifact@v4
        with:
          name: estate-cpanel
          path: estate-cpanel.zip
